# Compila la web, el instalador de Windows (Electron/NSIS) y el APK de Android (Capacitor).
# En cada push a main se generan artefactos; al crear un tag vX.Y.Z se publica un Release con
# FarmaSys-Setup.exe y FarmaSys.apk (los enlaces de /descargas apuntan a "latest").
name: Compilar y publicar

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web (lint, tipos, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: '1' }

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: '1' }
      - name: Empaquetar con electron-builder
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaSys-Setup.exe
          path: desktop/dist/FarmaSys-Setup.exe
          if-no-files-found: error

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Generar proyecto Android y compilar
        working-directory: mobile
        env:
          # Variable opcional del repositorio: si se define, la app abre ese servidor directamente
          FARMASYS_URL: ${{ vars.FARMASYS_URL }}
        run: |
          npm ci --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#059669' --splashBackgroundColor '#022c22' || echo "Iconos por defecto"
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Firmar APK
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > firma.keystore
          else
            # Sin secretos: se firma con una clave generada en la compilación (instalable; para actualizar sin desinstalar, configura ANDROID_KEYSTORE_BASE64)
            KEYSTORE_PASSWORD=farmasys; KEY_ALIAS=farmasys
            keytool -genkeypair -v -keystore firma.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=FarmaSys, O=FarmaSys, C=PE"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk FarmaSys-alineado.apk
          "$BT/apksigner" sign --ks firma.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEYSTORE_PASSWORD" --out FarmaSys.apk FarmaSys-alineado.apk
          "$BT/apksigner" verify FarmaSys.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FarmaSys.apk
          path: mobile/FarmaSys.apk
          if-no-files-found: error

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artefactos }
      - uses: softprops/action-gh-release@v2
        with:
          name: FarmaSys ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artefactos/FarmaSys-Setup.exe/FarmaSys-Setup.exe
            artefactos/FarmaSys.apk/FarmaSys.apk
